[project]
name = "llm-prompt-injection-test-kit"
version = "0.1.0"
description = "Defensive prompt-injection resilience testing kit for your own LLM applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = []

[project.scripts]
prompt-injection-tester = "prompt_injection_tester:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["prompt_injection_tester", "demo_target"]

[tool.ruff]
line-length = 100
target-version = "py39"
